<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni Kroos Academy - Educational Quiz Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for Math & Science formulas -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Brand -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showHomeScreen()">
                <div class="bg-blue-600 text-white p-2 rounded-xl font-bold text-xl flex items-center justify-center w-10 h-10 shadow-md">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">Toni Kroos Academy</h1>
                    <p class="text-xs text-blue-400 font-medium">WASSCE • BECE • Tertiary</p>
                </div>
            </div>

            <!-- Stats Bar (XP & Streaks) -->
            <div class="flex items-center space-x-3 bg-gray-900 px-3 py-1.5 rounded-xl border border-gray-800 text-xs">
                <div class="flex items-center space-x-1" title="Daily Study Streak">
                    <i class="fas fa-fire text-amber-500 animate-pulse"></i>
                    <span id="streak-count" class="font-bold text-white">1</span>
                    <span class="text-gray-400">Days</span>
                </div>
                <div class="h-3 w-px bg-gray-700"></div>
                <div class="flex items-center space-x-1" title="Total XP Earned">
                    <i class="fas fa-bolt text-yellow-400"></i>
                    <span id="xp-count" class="font-bold text-white">0</span>
                    <span class="text-yellow-400">XP</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">

        <!-- HOME SCREEN: Subject Category Selector -->
        <div id="home-screen" class="space-y-6">
            
            <div class="text-center py-4">
                <h2 class="text-2xl font-extrabold text-white">Choose Your Level & Subject</h2>
                <p class="text-sm text-gray-400 mt-1">Select a subject below to start practicing questions with step-by-step solutions.</p>
            </div>

            <!-- Level Selector Tabs -->
            <div class="flex border-b border-gray-800 text-sm font-semibold justify-center space-x-6">
                <button onclick="filterLevel('WASSCE')" id="tab-wassce" class="pb-3 border-b-2 border-blue-500 text-blue-400 px-2">WASSCE (SHS)</button>
                <button onclick="filterLevel('BECE')" id="tab-bece" class="pb-3 border-b-2 border-transparent text-gray-400 hover:text-white px-2">BECE (JHS)</button>
                <button onclick="filterLevel('TERTIARY')" id="tab-tertiary" class="pb-3 border-b-2 border-transparent text-gray-400 hover:text-white px-2">Tertiary</button>
            </div>

            <!-- Subject Cards Grid -->
            <div id="subjects-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Subject cards dynamically rendered by JS -->
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden space-y-6">
            
            <!-- Quiz Header -->
            <div class="flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-800">
                <button onclick="showHomeScreen()" class="text-xs text-gray-400 hover:text-white flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Exit Quiz
                </button>
                <span id="quiz-title" class="font-bold text-sm text-blue-400">Subject Name</span>
                <span id="quiz-progress-text" class="text-xs text-gray-400 font-mono">Q 1/5</span>
            </div>

            <!-- Question & Options Card -->
            <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6 space-y-6 shadow-xl">
                
                <!-- Question Box -->
                <div id="question-text" class="text-base sm:text-lg font-medium text-white leading-relaxed">
                    <!-- Question string rendered here -->
                </div>

                <!-- Options List -->
                <div id="options-container" class="space-y-3">
                    <!-- Option buttons rendered here -->
                </div>

                <!-- Solution & Explanation Box -->
                <div id="explanation-box" class="hidden bg-blue-950/40 border border-blue-800/60 p-4 rounded-xl text-sm text-blue-200 space-y-1">
                    <div class="font-bold text-yellow-400 flex items-center">
                        <i class="fas fa-lightbulb mr-2"></i> Step-by-Step Explanation:
                    </div>
                    <div id="explanation-text" class="text-gray-300"></div>
                </div>

                <!-- Controls -->
                <div class="pt-2 flex justify-end">
                    <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition shadow-lg">
                        Next Question <i class="fas fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- SUMMARY / RESULTS SCREEN -->
        <div id="results-screen" class="hidden text-center bg-gray-900 rounded-2xl border border-gray-800 p-8 space-y-6 shadow-2xl">
            <div class="text-5xl">🏆</div>
            <h2 class="text-2xl font-bold text-white">Quiz Completed!</h2>
            
            <div class="grid grid-cols-2 gap-4 max-w-xs mx-auto">
                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                    <span id="final-score" class="block text-2xl font-bold text-emerald-400">0/5</span>
                    <span class="text-xs text-gray-400">Score</span>
                </div>
                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                    <span id="final-xp" class="block text-2xl font-bold text-yellow-400">+0 XP</span>
                    <span class="text-xs text-gray-400">XP Gained</span>
                </div>
            </div>

            <div class="flex justify-center space-x-4 pt-2">
                <button onclick="restartCurrentQuiz()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl transition">
                    <i class="fas fa-redo mr-2"></i> Try Again
                </button>
                <button onclick="showHomeScreen()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-bold rounded-xl transition">
                    Choose Another Subject
                </button>
            </div>
        </div>

    </main>

    <!-- App Data & Logic -->
    <script>
        // QUESTION DATABASE (5 Questions Per Subject)
        const db = {
            WASSCE: [
                {
                    subject: "Elective Mathematics",
                    icon: "fa-calculator",
                    questions: [
                        { q: "Solve for $x$: $2x + 5 = 15$", options: ["x = 3", "x = 5", "x = 10", "x = 7"], correct: 1, sol: "Subtract 5 from both sides: $2x = 10$, then divide by 2: $x = 5$." },
                        { q: "Evaluate $\\lim_{x \\to 2} (x^2 - 4)/(x - 2)$", options: ["0", "2", "4", "Undefined"], correct: 2, sol: "Factor the numerator: $(x-2)(x+2)/(x-2) = x+2$. Evaluate at $x=2$: $2+2 = 4$." },
                        { q: "If $f(x) = 3x^2 + 2x$, find $f'(x)$.", options: ["$6x + 2$", "$3x + 2$", "$6x^2$", "$6x$"], correct: 0, sol: "Apply the power rule: $\\frac{d}{dx}(3x^2) = 6x$ and $\\frac{d}{dx}(2x) = 2$. Thus $f'(x) = 6x + 2$." },
                        { q: "Find the determinant of matrix $\\begin{pmatrix} 3 & 2 \\\\ 1 & 4 \\end{pmatrix}$.", options: ["10", "14", "12", "8"], correct: 0, sol: "Determinant = $(3 \\times 4) - (2 \\times 1) = 12 - 2 = 10$." },
                        { q: "What is the integrate of $\\int 2x \\, dx$?", options: ["$x^2 + C$", "$2x^2 + C$", "$x + C$", "$2 + C$"], correct: 0, sol: "Integral of $2x$ is $2(x^2/2) + C = x^2 + C$." }
                    ]
                },
                {
                    subject: "Physics",
                    icon: "fa-atom",
                    questions: [
                        { q: "What is the SI unit of Force?", options: ["Joule", "Watt", "Newton", "Pascal"], correct: 2, sol: "The SI unit of force is the Newton (N), named after Isaac Newton." },
                        { q: "Calculate kinetic energy of a 2kg mass moving at 3m/s.", options: ["6 J", "9 J", "18 J", "12 J"], correct: 1, sol: "$KE = \\frac{1}{2} mv^2 = \\frac{1}{2} (2)(3^2) = 9\\text{ Joules}$." },
                        { q: "What is the acceleration due to gravity on Earth surface?", options: ["$9.8\\text{ m/s}^2$", "$10\\text{ m/s}^2$", "$8.9\\text{ m/s}^2$", "$9.8\\text{ cm/s}^2$"], correct: 0, sol: "Standard acceleration due to gravity on Earth is approximately $9.8\\text{ m/s}^2$." },
                        { q: "State Ohm's Law formula.", options: ["$P = VI$", "$V = IR$", "$F = ma$", "$E = mc^2$"], correct: 1, sol: "Ohm's Law states that Voltage ($V$) equals Current ($I$) times Resistance ($R$): $V = IR$." },
                        { q: "Which ray has the highest penetrating power?", options: ["Alpha", "Beta", "Gamma", "X-Ray"], correct: 2, sol: "Gamma rays have no mass and high energy, giving them the highest penetration." }
                    ]
                },
                {
                    subject: "Integrated Science",
                    icon: "fa-flask",
                    questions: [
                        { q: "Which gas is required for respiration?", options: ["Carbon Dioxide", "Nitrogen", "Oxygen", "Hydrogen"], correct: 2, sol: "Living organisms require Oxygen ($O_2$) for cellular respiration." },
                        { q: "What is the pH of pure water at 25°C?", options: ["0", "7", "14", "5"], correct: 1, sol: "Pure water is neutral with a pH of 7." },
                        { q: "Which plant tissue transports water from roots?", options: ["Phloem", "Xylem", "Stomata", "Cortex"], correct: 1, sol: "Xylem transports water and minerals up from the roots." },
                        { q: "What is the chemical formula for table salt?", options: ["$\text{NaOH}$", "$\text{NaCl}$", "$\text{HCl}$", "$\text{CaCO}_3$"], correct: 1, sol: "Sodium Chloride is represented by $\text{NaCl}$." },
                        { q: "Which part of the cell controls all cell activities?", options: ["Mitochondria", "Nucleus", "Vacuole", "Cell Wall"], correct: 1, sol: "The nucleus contains genetic material and directs cell operations." }
                    ]
                }
            ],
            BECE: [
                {
                    subject: "Core Mathematics",
                    icon: "fa-square-root-variable",
                    questions: [
                        { q: "Simplify: $3(x + 4) - 2x$", options: ["$x + 12$", "$x + 4$", "$5x + 12$", "$x - 12$"], correct: 0, sol: "Expand: $3x + 12 - 2x = (3x - 2x) + 12 = x + 12$." },
                        { q: "Find the mean of numbers 4, 8, 12, 16.", options: ["8", "10", "12", "14"], correct: 1, sol: "Sum = $4+8+12+16 = 40$. Count = 4. Mean = $40 / 4 = 10$." },
                        { q: "Convert 0.75 to a simple fraction.", options: ["1/2", "3/4", "2/3", "4/5"], correct: 1, sol: "$0.75 = 75/100 = 3/4$ when simplified." },
                        { q: "Calculate perimeter of a square with side length 5cm.", options: ["20 cm", "25 cm", "10 cm", "15 cm"], correct: 0, sol: "Perimeter = $4 \\times \\text{side} = 4 \\times 5\\text{cm} = 20\\text{cm}$." },
                        { q: "What is the prime factor of 12?", options: ["2 and 3", "3 and 4", "1 and 12", "2 and 6"], correct: 0, sol: "Prime factors of 12 are 2 and 3 ($12 = 2^2 \\times 3$)." }
                    ]
                },
                {
                    subject: "Social Studies",
                    icon: "fa-earth-africa",
                    questions: [
                        { q: "In which year did Ghana gain independence?", options: ["1957", "1960", "1948", "1966"], correct: 0, sol: "Ghana gained independence on March 6, 1957." },
                        { q: "Who was Ghana's first president?", options: ["Dr. Kwame Nkrumah", "J.B. Danquah", "K.A. Busia", "Jerry John Rawlings"], correct: 0, sol: "Dr. Kwame Nkrumah became the first President of Ghana." },
                        { q: "What is the capital city of Ghana?", options: ["Kumasi", "Accra", "Tamale", "Cape Coast"], correct: 1, sol: "Accra is the administrative capital of Ghana." },
                        { q: "Which organ of government makes laws?", options: ["Executive", "Judiciary", "Legislature", "Police"], correct: 2, sol: "The Legislature (Parliament) formulates and passes laws." },
                        { q: "Which water body lies south of Ghana?", options: ["Atlantic Ocean (Gulf of Guinea)", "Lake Volta", "Indian Ocean", "Red Sea"], correct: 0, sol: "Southern Ghana borders the Gulf of Guinea in the Atlantic Ocean." }
                    ]
                }
            ],
            TERTIARY: [
                {
                    subject: "Computer Science",
                    icon: "fa-laptop-code",
                    questions: [
                        { q: "What does HTML stand for?", options: ["Hyper Text Markup Language", "High Tech Machine Language", "Hyperlink Text Management Language", "Home Tool Markup Language"], correct: 0, sol: "HTML stands for Hyper Text Markup Language." },
                        { q: "Which data structure uses FIFO (First In First Out)?", options: ["Stack", "Queue", "Tree", "Graph"], correct: 1, sol: "Queue works on FIFO principle (First In First Out)." },
                        { q: "What is the time complexity of Binary Search?", options: ["O(n)", "O(1)", "O(log n)", "O(n^2)"], correct: 2, sol: "Binary search divides the array in half each time, giving $O(\\log n)$ complexity." },
                        { q: "Which key uniquely identifies a record in a database table?", options: ["Foreign Key", "Primary Key", "Composite Key", "Unique Key"], correct: 1, sol: "A Primary Key uniquely identifies each row in a database table." },
                        { q: "Which memory is fastest?", options: ["RAM", "Hard Disk", "Cache Memory", "ROM"], correct: 2, sol: "Cache memory is integrated close to CPU cores for ultra-fast access." }
                    ]
                }
            ]
        };

        // App State
        let currentLevel = 'WASSCE';
        let currentQuizData = null;
        let qIdx = 0;
        let score = 0;
        let userXP = parseInt(localStorage.getItem('tka_xp')) || 0;
        let userStreak = parseInt(localStorage.getItem('tka_streak')) || 1;

        // UI Updates
        function updateStatsDisplay() {
            document.getElementById('xp-count').innerText = userXP;
            document.getElementById('streak-count').innerText = userStreak;
        }

        function filterLevel(level) {
            currentLevel = level;
            ['wassce', 'bece', 'tertiary'].forEach(l => {
                const btn = document.getElementById(`tab-${l}`);
                if (l.toUpperCase() === level) {
                    btn.className = "pb-3 border-b-2 border-blue-500 text-blue-400 px-2 font-bold";
                } else {
                    btn.className = "pb-3 border-b-2 border-transparent text-gray-400 hover:text-white px-2";
                }
            });
            renderSubjects();
        }

        function renderSubjects() {
            const grid = document.getElementById('subjects-grid');
            grid.innerHTML = db[currentLevel].map((s, index) => `
                <div onclick="startQuiz('${currentLevel}', ${index})" class="bg-gray-900 border border-gray-800 hover:border-blue-500/50 p-5 rounded-2xl cursor-pointer transition shadow-md flex items-center space-x-4">
                    <div class="w-12 h-12 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-xl flex items-center justify-center text-xl">
                        <i class="fas ${s.icon}"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-base">${s.subject}</h3>
                        <p class="text-xs text-gray-400">${s.questions.length} Practice Questions • Step-by-Step</p>
                    </div>
                </div>
            `).join('');
        }

        function showHomeScreen() {
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            renderSubjects();
        }

        function startQuiz(level, subjectIndex) {
            currentQuizData = db[level][subjectIndex];
            qIdx = 0;
            score = 0;

            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-title').innerText = currentQuizData.subject;

            renderQuestion();
        }

        function restartCurrentQuiz() {
            qIdx = 0;
            score = 0;
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuizData.questions[qIdx];
            document.getElementById('quiz-progress-text').innerText = `Q ${qIdx + 1}/${currentQuizData.questions.length}`;
            document.getElementById('question-text').innerHTML = q.q;

            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const container = document.getElementById('options-container');
            container.innerHTML = q.options.map((opt, i) => `
                <button id="opt-${i}" onclick="checkAnswer(${i})" class="w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-950 hover:bg-gray-800 hover:border-gray-700 font-medium text-sm text-gray-200 transition flex justify-between items-center">
                    <span>${opt}</span>
                    <span class="w-6 h-6 rounded-full border border-gray-700 flex items-center justify-center text-xs text-gray-400 font-bold">${String.fromCharCode(65 + i)}</span>
                </button>
            `).join('');

            if (window.MathJax) MathJax.typesetPromise();
        }

        function checkAnswer(chosenIdx) {
            const q = currentQuizData.questions[qIdx];
            const isCorrect = chosenIdx === q.correct;

            // Highlight buttons
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                btn.onclick = null; // disable further clicks
                if (i === q.correct) {
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-950/60 text-emerald-200 font-medium text-sm flex justify-between items-center shadow-lg";
                } else if (i === chosenIdx) {
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-red-500 bg-red-950/60 text-red-200 font-medium text-sm flex justify-between items-center";
                } else {
                    btn.className = "w-full text-left p-4 rounded-xl border border-gray-900 bg-gray-950 text-gray-600 font-medium text-sm flex justify-between items-center opacity-40";
                }
            });

            // Show step-by-step solution
            document.getElementById('explanation-text').innerHTML = q.sol;
            document.getElementById('explanation-box').classList.remove('hidden');

            if (isCorrect) {
                score++;
                userXP += 10;
                localStorage.setItem('tka_xp', userXP);
                updateStatsDisplay();
                confetti({ particleCount: 25, spread: 50, origin: { y: 0.8 } });
            }

            document.getElementById('next-btn').classList.remove('hidden');
            if (window.MathJax) MathJax.typesetPromise();
        }

        function nextQuestion() {
            qIdx++;
            if (qIdx < currentQuizData.questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = `${score}/${currentQuizData.questions.length}`;
            document.getElementById('final-xp').innerText = `+${score * 10} XP`;

            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            updateStatsDisplay();
            filterLevel('WASSCE');
        });
    </script>
</body>
</html>
