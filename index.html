<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni Kroos Academy - Select Course & Level</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for Formulas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToHome()">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <span class="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">Toni Kroos Academy</span>
                    <span class="block text-xs font-semibold text-indigo-600 dark:text-indigo-400">Interactive Quiz Platform</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Welcome / Course Selection Screen -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div id="homeView" class="space-y-8">
            <div class="text-center max-w-2xl mx-auto space-y-4 pt-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800/50">
                    <i class="fa-solid fa-sliders mr-2"></i> Custom Course & Level Engine
                </span>
                <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                    Select Your Level & Course
                </h1>
                <p class="text-slate-600 dark:text-slate-400 text-sm md:text-base">
                    Choose your level of education and your specific course stream to load specialized practice quizzes!
                </p>
            </div>

            <!-- DUAL SELECTOR BOX (Level + Course) -->
            <div class="max-w-xl mx-auto glass-card p-6 rounded-2xl shadow-xl border border-indigo-100 dark:border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- 1. Education Level -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                        <i class="fa-solid fa-school mr-1"></i> Level of Education:
                    </label>
                    <select id="levelSelect" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-bold text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="wassce">🏫 WASSCE / SHS</option>
                        <option value="bece">🎓 BECE / JHS</option>
                        <option value="tertiary">🏛️ University / Tertiary</option>
                    </select>
                </div>

                <!-- 2. Course / Department -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                        <i class="fa-solid fa-book-bookmark mr-1"></i> Course / Stream:
                    </label>
                    <select id="courseSelect" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-bold text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </select>
                </div>

            </div>

            <!-- Subject Cards Container -->
            <div id="subjectCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
            </div>
        </div>

        <!-- Active Quiz View -->
        <div id="quizView" class="hidden max-w-2xl mx-auto space-y-6">
            <div class="flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-400">
                <button onclick="resetToHome()" class="hover:text-slate-800 dark:hover:text-white flex items-center">
                    <i class="fa-solid fa-xmark mr-1 text-sm"></i> Exit Quiz
                </button>
                <div id="questionTracker">Question 1 of 5</div>
                <div id="activeBadge" class="text-indigo-600 font-extrabold uppercase">COURSE QUIZ</div>
            </div>

            <div class="w-full bg-slate-200 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
            </div>

            <div class="glass-card rounded-2xl p-6 md:p-8 space-y-6 border border-slate-200 dark:border-slate-800 shadow-xl">
                <div id="questionText" class="text-lg md:text-xl font-bold text-slate-900 dark:text-white"></div>
                <div id="optionsContainer" class="space-y-3 pt-2"></div>

                <div id="explanationBox" class="hidden p-4 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 space-y-2">
                    <div class="font-bold text-xs text-indigo-600 dark:text-indigo-400 flex items-center">
                        <i class="fa-solid fa-circle-info mr-1.5"></i> Step-by-Step Solution
                    </div>
                    <div id="explanationText" class="text-xs text-slate-600 dark:text-slate-300"></div>
                </div>

                <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full py-3.5 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-500/30">
                    Next Question <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

        <!-- Result View -->
        <div id="resultView" class="hidden max-w-xl mx-auto space-y-6 text-center">
            <div class="glass-card rounded-2xl p-8 space-y-6 border border-slate-200 dark:border-slate-800 shadow-2xl">
                <div class="w-20 h-20 mx-auto rounded-full bg-indigo-100 dark:bg-indigo-950/80 text-indigo-600 flex items-center justify-center text-3xl font-extrabold">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">Quiz Complete!</h2>
                <div id="finalScore" class="text-4xl font-extrabold text-indigo-600">0/0</div>
                <button onclick="resetToHome()" class="w-full py-3.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">
                    Select Another Course <i class="fa-solid fa-rotate-right ml-2"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Data and Script Engine -->
    <script>
        const courseMapping = {
            wassce: [
                { id: 'science', name: 'General Science' },
                { id: 'arts', name: 'General Arts' },
                { id: 'business', name: 'Business' },
                { id: 'visual_arts', name: 'Visual Arts' }
            ],
            bece: [
                { id: 'jhs_core', name: 'Core Subjects (JHS 1 - 3)' }
            ],
            tertiary: [
                { id: 'comp_sci', name: 'Computer Science / IT' },
                { id: 'engineering', name: 'Engineering / Physical Science' },
                { id: 'business_admin', name: 'Business Administration' }
            ]
        };

        const subjectDatabase = {
            science: [
                { id: 'elect_math', name: 'Elective Mathematics', desc: 'Matrices, Vectors & Calculus', icon: 'fa-calculator' },
                { id: 'biology', name: 'Biology', desc: 'Fungal Biology, Cell Structures & Genetics', icon: 'fa-dna' }
            ],
            arts: [
                { id: 'core_math', name: 'Core Mathematics', desc: 'Algebra, Probability & Statistics', icon: 'fa-chart-pie' },
                { id: 'gov', name: 'Government', desc: 'Constitution, Political Systems & Rights', icon: 'fa-landmark' }
            ],
            business: [
                { id: 'accounting', name: 'Financial Accounting', desc: 'Balance Sheets, Ledgers & Journals', icon: 'fa-receipt' },
                { id: 'core_math', name: 'Core Mathematics', desc: 'Percentages, Ratios & Interest', icon: 'fa-calculator' }
            ],
            visual_arts: [
                { id: 'gfx', name: 'Graphic Design', desc: 'Color Theory, Typography & Layouts', icon: 'fa-palette' }
            ],
            jhs_core: [
                { id: 'int_science', name: 'Integrated Science', desc: 'Photosynthesis, Cells & Matter', icon: 'fa-flask' },
                { id: 'jhs_math', name: 'JHS Mathematics', desc: 'Fractions, Probability & Equations', icon: 'fa-calculator' }
            ],
            comp_sci: [
                { id: 'dsa', name: 'Data Structures & Cache', desc: 'L1/L2 Cache Memory, Memory Latency', icon: 'fa-microchip' },
                { id: 'linear_algebra', name: 'Linear Algebra', desc: 'Matrix Multiplication, Determinants', icon: 'fa-square-root-variable' }
            ],
            engineering: [
                { id: 'linear_algebra', name: 'Linear Algebra', desc: 'Matrix Multiplication, Determinants', icon: 'fa-square-root-variable' }
            ],
            business_admin: [
                { id: 'bus_stats', name: 'Business Statistics', desc: 'Probability, Sampling & Data', icon: 'fa-chart-line' }
            ]
        };

        const quizQuestions = [
            { courseId: 'science', subjectId: 'elect_math', question: 'What is the sum of matrices $$\\begin{bmatrix} 2 & 4 \\\\ 1 & 3 \\end{bmatrix} + \\begin{bmatrix} 5 & 1 \\\\ 2 & 6 \\end{bmatrix}$$?', options: ['$$\\begin{bmatrix} 7 & 5 \\\\ 3 & 9 \\end{bmatrix}$$', '$$\\begin{bmatrix} 10 & 4 \\\\ 2 & 18 \\end{bmatrix}$$'], correct: 0, explanation: 'Add matching elements: Top-left ($2+5=7$), Top-right ($4+1=5$), Bottom-left ($1+2=3$), Bottom-right ($3+6=9$).' },
            { courseId: 'science', subjectId: 'biology', question: 'Which hyphae structure anchors *Rhizopus* fungi to its substrate?', options: ['Rhizoids', 'Stolons', 'Sporangiophores'], correct: 0, explanation: 'Rhizoids act as root-like hyphae to absorb food and anchor the mold.' },
            { courseId: 'comp_sci', subjectId: 'dsa', question: 'Which level of CPU cache is directly integrated on the processor core?', options: ['L1 Cache', 'L2 Cache', 'L3 Cache'], correct: 0, explanation: 'L1 Cache is integrated into the core and provides the fastest access speeds.' },
            { courseId: 'jhs_core', subjectId: 'jhs_math', question: 'What is the probability of rolling an even number on a 6-sided die?', options: ['1/2', '1/3', '1/6'], correct: 0, explanation: 'Even numbers = {2, 4, 6}. Probability = 3/6 = 1/2.' },
            { courseId: 'jhs_core', subjectId: 'int_science', question: 'Which process allows green plants to convert sunlight into chemical energy?', options: ['Photosynthesis', 'Respiration', 'Transpiration'], correct: 0, explanation: 'Photosynthesis produces glucose using sunlight, water, and carbon dioxide.' }
        ];

        let activeQuizQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function updateCourseOptions() {
            const selectedLevel = document.getElementById('levelSelect').value;
            const courseSelect = document.getElementById('courseSelect');
            courseSelect.innerHTML = '';

            const courses = courseMapping[selectedLevel] || [];
            courses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = c.name;
                courseSelect.appendChild(opt);
            });

            renderSubjects();
        }

        function renderSubjects() {
            const courseSelect = document.getElementById('courseSelect');
            const courseId = courseSelect.value;
            const grid = document.getElementById('subjectCardsGrid');
            grid.innerHTML = '';

            const subjects = subjectDatabase[courseId] || [];
            
            if (subjects.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 font-bold">No subjects added for this course stream yet. More coming soon!</div>`;
                return;
            }

            subjects.forEach(s => {
                const card = document.createElement('div');
                card.onclick = () => startCourseQuiz(courseId, s.id);
                card.className = `glass-card rounded-2xl p-6 space-y-4 hover:shadow-xl hover:-translate-y-1 transition-all duration-200 cursor-pointer border border-slate-200 dark:border-slate-800`;
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-xl bg-indigo-100 dark:bg-indigo-950 text-indigo-600 flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid ${s.icon}"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900 dark:text-white text-lg">${s.name}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${s.desc}</p>
                    </div>
                    <div class="pt-2 flex items-center text-xs font-bold text-indigo-600">
                        Start Practice <i class="fa-solid fa-arrow-right ml-2"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function startCourseQuiz(courseId, subjectId) {
            activeQuizQuestions = quizQuestions.filter(q => q.courseId === courseId && q.subjectId === subjectId);

            if (activeQuizQuestions.length === 0) {
                alert('Quiz questions for this subject are currently being added!');
                return;
            }

            currentIndex = 0;
            score = 0;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('quizView').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = activeQuizQuestions[currentIndex];
            document.getElementById('questionTracker').innerText = `Question ${currentIndex + 1} of ${activeQuizQuestions.length}`;
            document.getElementById('progressBar').style.width = `${((currentIndex) / activeQuizQuestions.length) * 100}%`;
            document.getElementById('questionText').innerHTML = q.question;
            document.getElementById('explanationBox').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-left font-medium text-sm flex items-center justify-between";
                btn.onclick = () => selectOption(idx);
                btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle"></i>`;
                container.appendChild(btn);
            });

            if (window.MathJax) { MathJax.Hub.Queue(["Typeset", MathJax.Hub, "quizView"]); }
        }

        function selectOption(idx) {
            const q = activeQuizQuestions[currentIndex];
            const buttons = document.getElementById('optionsContainer').children;
            for (let b of buttons) b.disabled = true;

            if (idx === q.correct) {
                score++;
                buttons[idx].className = "w-full p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold text-sm flex justify-between";
            } else {
                buttons[idx].className = "w-full p-4 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold text-sm flex justify-between";
                buttons[q.correct].className = "w-full p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold text-sm flex justify-between";
            }

            document.getElementById('explanationText').innerText = q.explanation;
            document.getElementById('explanationBox').classList.remove('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuizQuestions.length) { loadQuestion(); } 
            else { showResults(); }
        }

        function showResults() {
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultView').classList.remove('hidden');
            document.getElementById('finalScore').innerText = `${score}/${activeQuizQuestions.length}`;
            if (window.confetti) confetti({ particleCount: 100, spread: 70 });
        }

        function resetToHome() {
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
        }

        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }

        // Event listeners to ensure options populate instantly
        document.getElementById('levelSelect').addEventListener('change', updateCourseOptions);
        document.getElementById('courseSelect').addEventListener('change', renderSubjects);

        // Run immediately when script loads
        updateCourseOptions();
    </script>
</body>
</html>
