<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni Kroos Academy - Educational Quiz Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for Math & Science formulas -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar with Gamification Dashboard -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <!-- Brand -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToHome()">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-10 h-10 shadow-lg">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">Toni Kroos Academy</h1>
                    <p class="text-xs text-blue-400 font-medium">WASSCE • BECE • Tertiary</p>
                </div>
            </div>

            <!-- Stats Bar (XP & Streaks) -->
            <div class="flex items-center space-x-4 bg-gray-900/80 px-4 py-2 rounded-xl border border-gray-700">
                <div class="flex items-center space-x-1.5" title="Daily Study Streak">
                    <i class="fas fa-fire text-amber-500 text-lg animate-pulse"></i>
                    <span id="streak-count" class="font-bold text-white text-sm">1</span>
                    <span class="text-xs text-gray-400 font-semibold">Days</span>
                </div>
                
                <div class="h-4 w-px bg-gray-700"></div>

                <div class="flex items-center space-x-1.5" title="Total XP Earned">
                    <i class="fas fa-bolt text-yellow-400 text-lg"></i>
                    <span id="xp-count" class="font-bold text-white text-sm">0</span>
                    <span class="text-xs text-yellow-400/80 font-semibold">XP</span>
                </div>

                <div class="h-4 w-px bg-gray-700"></div>

                <div class="flex items-center space-x-1" title="Current Level">
                    <i class="fas fa-shield-halved text-blue-400 text-sm"></i>
                    <span id="user-level" class="text-xs font-bold text-blue-300">Scholar I</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- App Container (Dynamic Home / Quiz Screen) -->
        <div id="quiz-app-container">
            <!-- Rendered by JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 mt-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 Toni Kroos Academy. All rights reserved.</p>
    </footer>

    <!-- JavaScript Quiz Engine -->
    <script>
        // Sample Database with Questions
        const sampleQuizData = [
            {
                question: "Solve for $x$ in the linear equation: $2x + 5 = 15$",
                options: ["$x = 3$", "$x = 5$", "$x = 10$", "$x = 7$"],
                correct: 1,
                solution: "Subtract 5 from both sides: $2x = 10$. Then divide both sides by 2: $x = 5$."
            },
            {
                question: "Which organelle is known as the powerhouse of the cell?",
                options: ["Nucleus", "Ribosome", "Mitochondria", "Golgi Apparatus"],
                correct: 2,
                solution: "Mitochondria generate most of the chemical energy needed to power the cell's biochemical reactions."
            },
            {
                question: "What is the capital city of Ghana?",
                options: ["Kumasi", "Accra", "Tamale", "Cape Coast"],
                correct: 1,
                solution: "Accra has been the capital of Ghana since 1877."
            }
        ];

        // User Data State
        let userStats = JSON.parse(localStorage.getItem('tka_user_stats')) || {
            xp: 0,
            streak: 1,
            lastVisit: new Date().toDateString()
        };

        // Current Active Quiz State
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;
        let isAnswerSubmitted = false;

        function saveUserStats() {
            localStorage.setItem('tka_user_stats', JSON.stringify(userStats));
        }

        function updateStatsUI() {
            document.getElementById('xp-count').innerText = userStats.xp;
            document.getElementById('streak-count').innerText = userStats.streak;
            let level = 'Scholar I';
            if (userStats.xp >= 100) level = 'Scholar II';
            if (userStats.xp >= 300) level = 'WASSCE Master';
            document.getElementById('user-level').innerText = level;
        }

        function resetToHome() {
            const container = document.getElementById('quiz-app-container');
            container.innerHTML = `
                <div class="bg-gray-800 rounded-2xl border border-gray-700 p-8 text-center space-y-6">
                    <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-3xl border border-blue-500/30">
                        <i class="fas fa-play"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-white">GLearn-Style Interactive Practice</h2>
                    <p class="text-gray-400 max-w-lg mx-auto text-sm leading-relaxed">
                        Test your knowledge across WASSCE & BECE core subjects. Get instant feedback, step-by-step solutions, and earn XP!
                    </p>
                    <button onclick="startQuiz()" class="px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/25 text-lg">
                        <i class="fas fa-bolt mr-2 text-yellow-300"></i> Start Quiz Now
                    </button>
                </div>
            `;
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            isAnswerSubmitted = false;
            selectedOption = null;
            const q = sampleQuizData[currentQuestionIndex];
            const totalQ = sampleQuizData.length;
            const progressPercent = ((currentQuestionIndex + 1) / totalQ) * 100;

            const container = document.getElementById('quiz-app-container');
            container.innerHTML = `
                <div class="bg-gray-800 rounded-2xl border border-gray-700 p-6 space-y-6 shadow-xl">
                    <!-- Progress Bar -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-semibold text-gray-400">
                            <span>Question ${currentQuestionIndex + 1} of ${totalQ}</span>
                            <span>Score: ${score} XP</span>
                        </div>
                        <div class="w-full bg-gray-700 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>

                    <!-- Question Text -->
                    <div class="text-lg font-medium text-white leading-relaxed pt-2">
                        ${q.question}
                    </div>

                    <!-- Options Grid -->
                    <div class="space-y-3" id="options-list">
                        ${q.options.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectOption(${idx})" class="w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 hover:bg-gray-700/50 hover:border-blue-500/50 transition flex items-center justify-between font-medium">
                                <span>${opt}</span>
                                <span class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-xs text-gray-400 font-bold">${String.fromCharCode(65 + idx)}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Action Button & Solution Area -->
                    <div class="pt-4 border-t border-gray-700/80 flex flex-col sm:flex-row gap-3 justify-between items-center">
                        <div id="solution-box" class="hidden text-sm text-blue-300 bg-blue-950/40 p-4 rounded-xl border border-blue-800/50 w-full">
                            <strong><i class="fas fa-lightbulb text-yellow-400 mr-1"></i> Explanation:</strong>
                            <p class="mt-1 text-gray-300">${q.solution}</p>
                        </div>
                        <button id="submit-btn" onclick="submitAnswer()" disabled class="w-full sm:w-auto px-6 py-3 bg-gray-700 text-gray-400 font-bold rounded-xl cursor-not-allowed transition">
                            Check Answer
                        </button>
                    </div>
                </div>
            `;

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function selectOption(index) {
            if (isAnswerSubmitted) return;
            selectedOption = index;

            // Highlight chosen option
            sampleQuizData[currentQuestionIndex].options.forEach((_, idx) => {
                const btn = document.getElementById(`opt-${idx}`);
                if (idx === index) {
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-blue-500 bg-blue-900/30 font-medium flex items-center justify-between";
                } else {
                    btn.className = "w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 hover:bg-gray-700/50 font-medium flex items-center justify-between opacity-70";
                }
            });

            // Enable submit button
            const subBtn = document.getElementById('submit-btn');
            subBtn.disabled = false;
            subBtn.className = "w-full sm:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition cursor-pointer";
        }

        function submitAnswer() {
            if (selectedOption === null || isAnswerSubmitted) return;
            isAnswerSubmitted = true;

            const q = sampleQuizData[currentQuestionIndex];
            const isCorrect = selectedOption === q.correct;

            // Apply GLearn-style correct/wrong coloring
            q.options.forEach((_, idx) => {
                const btn = document.getElementById(`opt-${idx}`);
                btn.onclick = null; // Disable clicking

                if (idx === q.correct) {
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-950/60 text-emerald-200 font-medium flex items-center justify-between shadow-lg shadow-emerald-900/20";
                } else if (idx === selectedOption && !isCorrect) {
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-red-500 bg-red-950/60 text-red-200 font-medium flex items-center justify-between";
                } else {
                    btn.className = "w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-900/40 text-gray-500 font-medium flex items-center justify-between opacity-40";
                }
            });

            // Reveal solution box
            document.getElementById('solution-box').classList.remove('hidden');

            if (isCorrect) {
                score++;
                userStats.xp += 10;
                saveUserStats();
                updateStatsUI();
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
            }

            // Transform submit button to "Next Question"
            const subBtn = document.getElementById('submit-btn');
            subBtn.innerText = currentQuestionIndex + 1 < sampleQuizData.length ? "Next Question →" : "View Final Results 🏆";
            subBtn.onclick = nextQuestion;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < sampleQuizData.length) {
                renderQuestion();
            } else {
                renderCompletionScreen();
            }
        }

        function renderCompletionScreen() {
            const total = sampleQuizData.length;
            const percentage = Math.round((score / total) * 100);

            // Trigger celebration
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

            const container = document.getElementById('quiz-app-container');
            container.innerHTML = `
                <div class="bg-gray-800 rounded-2xl border border-gray-700 p-8 text-center space-y-6 shadow-2xl">
                    <div class="w-20 h-20 bg-yellow-500/20 text-yellow-400 rounded-full flex items-center justify-center mx-auto text-4xl border border-yellow-500/30 animate-bounce">
                        🏆
                    </div>
                    <div>
                        <h2 class="text-3xl font-extrabold text-white">Quiz Completed!</h2>
                        <p class="text-gray-400 text-sm mt-1">Great effort on completing this practice session.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto">
                        <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-700">
                            <span class="block text-2xl font-bold text-emerald-400">${percentage}%</span>
                            <span class="text-xs text-gray-400 font-semibold">Accuracy</span>
                        </div>
                        <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-700">
                            <span class="block text-2xl font-bold text-yellow-400">+${score * 10} XP</span>
                            <span class="text-xs text-gray-400 font-semibold">XP Earned</span>
                        </div>
                    </div>

                    <div class="flex justify-center gap-4 pt-4">
                        <button onclick="startQuiz()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition shadow-lg">
                            <i class="fas fa-redo mr-2"></i> Try Again
                        </button>
                        <button onclick="resetToHome()" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-gray-200 font-bold rounded-xl transition">
                            Back to Home
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize on Load
        document.addEventListener('DOMContentLoaded', () => {
            updateStatsUI();
            resetToHome();
        });
    </script>
</body>
</html>
